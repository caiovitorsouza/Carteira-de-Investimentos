<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carteira</title>
<meta name="description" content="Acompanhe seus fundos imobiliários, ações e renda fixa em um só lugar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   TOKENS — paleta papel quente + verde floresta (Brasilidade editorial)
   ========================================================================= */
:root{
  /* light (padrão) */
  --bg:#F5F2E9;             /* papel quente — nem cream nem branco frio */
  --surface:#FFFFFF;        /* cartões */
  --surface-2:#FAF7EE;      /* seções */
  --ink:#122018;            /* near-black com tom verde */
  --ink-2:#2E3B33;          /* texto secundário */
  --muted:#6B7A72;          /* legendas, labels discretas */
  --line:#E3DBC9;           /* hairline de papel */
  --line-strong:#C9BFA8;    /* separador firme */
  --accent:#1E5435;         /* VERDE FLORESTA — único destaque */
  --accent-ink:#F6F2E7;     /* texto sobre o verde */
  --accent-soft:#DCE6DD;    /* fundo de badges verdes */
  --gain:#0F6B3E;           /* ganho (tom próximo do accent) */
  --loss:#B13828;           /* perda — tijolo, não vermelho berrante */
  --gain-soft:#D5E8DC;
  --loss-soft:#F2D9D3;
  --amber:#9A6A1F;          /* usado só no indicador "ao vivo" */

  /* Fontes */
  --f-serif: "Fraunces", Georgia, serif;
  --f-sans: "Inter", system-ui, -apple-system, Segoe UI, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  color-scheme: light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1512;
    --surface:#161F1B;
    --surface-2:#111915;
    --ink:#EBE6D8;
    --ink-2:#B6B4A5;
    --muted:#8E9A91;
    --line:#2A332E;
    --line-strong:#3E4A43;
    --accent:#5CC37D;
    --accent-ink:#0D1512;
    --accent-soft:#1C2E24;
    --gain:#5CC37D;
    --loss:#E07562;
    --gain-soft:#1E2E24;
    --loss-soft:#2F1A17;
    --amber:#D4A657;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1512;
  --surface:#161F1B;
  --surface-2:#111915;
  --ink:#EBE6D8;
  --ink-2:#B6B4A5;
  --muted:#8E9A91;
  --line:#2A332E;
  --line-strong:#3E4A43;
  --accent:#5CC37D;
  --accent-ink:#0D1512;
  --accent-soft:#1C2E24;
  --gain:#5CC37D;
  --loss:#E07562;
  --gain-soft:#1E2E24;
  --loss-soft:#2F1A17;
  --amber:#D4A657;
  color-scheme: dark;
}

/* =========================================================================
   BASE
   ========================================================================= */
*{box-sizing:border-box}
html{font-size:16px}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--f-sans);
  font-size:16px;
  line-height:1.5;
  font-feature-settings:"ss01","cv11";
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.num{font-variant-numeric: tabular-nums;}
button, input, textarea, select{font:inherit; color:inherit;}
button{cursor:pointer; background:none; border:0; padding:0;}
input, textarea, select{
  background:var(--surface);
  color:var(--ink);
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
  width:100%;
  transition:border-color .15s;
}
input:focus, textarea:focus, select:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);}
::selection{background:var(--accent); color:var(--accent-ink);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
.hide{display:none !important}

/* =========================================================================
   BOTÕES
   ========================================================================= */
.btn{
  font-family:var(--f-sans);
  font-weight:600;
  font-size:15px;
  padding:12px 20px;
  border-radius:10px;
  background:var(--accent);
  color:var(--accent-ink);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:opacity .15s, background .15s;
  white-space:nowrap;
}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5; cursor:default;}
.btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line-strong);}
.btn-ghost:hover{opacity:1; background:var(--surface);}
.btn-text{background:none; color:var(--muted); padding:8px 10px; font-weight:500; font-size:14px;}
.btn-text:hover{color:var(--ink); opacity:1;}
.btn-sm{padding:9px 14px; font-size:13.5px;}
.btn-full{width:100%}

.pill{
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 10px; border-radius:999px;
  font-size:13px; font-weight:500;
  background:var(--surface-2); color:var(--ink-2);
  border:1px solid var(--line);
}
.pill.gain{background:var(--gain-soft); color:var(--gain); border-color:transparent;}
.pill.loss{background:var(--loss-soft); color:var(--loss); border-color:transparent;}

/* =========================================================================
   LOGIN
   ========================================================================= */
.auth{
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:24px;
  background:
    radial-gradient(circle at 20% 10%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 50%),
    radial-gradient(circle at 90% 90%, color-mix(in srgb, var(--amber) 6%, transparent), transparent 55%),
    var(--bg);
}
.auth-card{
  width:100%;
  max-width:420px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:36px 32px;
  box-shadow: 0 1px 2px rgba(18,32,24,.04), 0 20px 50px -30px rgba(18,32,24,.25);
}
.brand{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-family:var(--f-serif);
  font-weight:600;
  font-size:20px;
  line-height:1;
  letter-spacing:-0.015em;
}
.brand-mark{
  width:34px; height:34px;
  border-radius:8px;
  background:var(--accent);
  color:var(--accent-ink);
  display:grid; place-items:center;
}
.brand-mark svg{width:18px; height:18px;}
.auth-title{
  font-family:var(--f-serif);
  font-weight:600;
  font-size:28px;
  letter-spacing:-0.02em;
  margin:28px 0 6px;
  line-height:1.1;
}
.auth-sub{color:var(--muted); font-size:15px; margin:0 0 28px;}
.field{display:block; margin-bottom:16px;}
.field > span{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
.auth-foot{text-align:center; margin-top:18px; font-size:14px; color:var(--muted);}
.auth-foot button{color:var(--accent); font-weight:600;}
.auth-foot button:hover{text-decoration:underline;}

.err{color:var(--loss); font-size:13.5px; min-height:1.2em; margin:4px 0 10px;}

/* =========================================================================
   APP SHELL
   ========================================================================= */
.topbar{
  position:sticky; top:0; z-index:20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(1.3) blur(10px);
  -webkit-backdrop-filter: saturate(1.3) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:860px; margin:0 auto;
  padding:14px 22px;
  display:flex; align-items:center; gap:16px;
}
.topbar .brand{font-size:17px;}
.topbar .brand-mark{width:30px; height:30px;}
.topbar .brand-mark svg{width:16px; height:16px;}
.topbar-end{margin-left:auto; display:flex; align-items:center; gap:6px;}
.icon-btn{
  width:38px; height:38px;
  border-radius:10px;
  display:grid; place-items:center;
  color:var(--muted);
  transition:background .15s, color .15s;
}
.icon-btn:hover{background:var(--surface); color:var(--ink);}
.icon-btn svg{width:18px; height:18px;}

.container{max-width:860px; margin:0 auto; padding:0 22px 100px;}

/* =========================================================================
   HERO — o patrimônio é a estrela da página
   ========================================================================= */
.hero{
  padding:48px 0 44px;
  border-bottom:1px solid var(--line);
}
.hero-eyebrow{
  font-size:13px;
  color:var(--muted);
  margin-bottom:10px;
  display:flex; align-items:center; gap:10px;
}
.live-dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--amber);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 25%, transparent);
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.live-dot{animation: pulse 2.4s ease-in-out infinite;}

.hero-value{
  font-family:var(--f-serif);
  font-variation-settings: "opsz" 144, "wght" 600;
  font-size: clamp(44px, 10vw, 72px);
  line-height:1;
  letter-spacing:-0.035em;
  margin:0;
  color:var(--ink);
}
.hero-change{
  display:flex; align-items:center; gap:14px;
  margin-top:16px;
  font-size:15px;
  color:var(--ink-2);
}
.hero-change .pill{font-size:14px;}
.hero-meta{
  margin-top:4px;
  font-size:14px;
  color:var(--muted);
}

/* =========================================================================
   SEÇÕES
   ========================================================================= */
.section{padding:36px 0;}
.section + .section{border-top:1px solid var(--line);}
.section-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  margin-bottom:20px;
}
.section-title{
  font-family:var(--f-serif);
  font-weight:600;
  font-size:24px;
  letter-spacing:-0.02em;
  margin:0;
  color:var(--ink);
}
.section-sub{
  color:var(--muted); font-size:14px; margin-top:4px;
}

/* =========================================================================
   ATIVOS
   ========================================================================= */
.asset-grid{display:grid; gap:12px;}
.asset{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px;
  display:grid;
  gap:14px;
  text-align:left;
  width:100%;
  transition:border-color .15s, transform .15s;
}
.asset:hover{border-color:var(--line-strong); transform:translateY(-1px);}
.asset-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
}
.asset-id{min-width:0;}
.ticker{
  font-family:var(--f-mono);
  font-weight:600;
  font-size:18px;
  letter-spacing:0;
  color:var(--ink);
}
.asset-name{
  font-size:13.5px;
  color:var(--muted);
  margin-top:3px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.asset-val{text-align:right; flex-shrink:0;}
.asset-val .v{
  font-family:var(--f-serif);
  font-variation-settings: "opsz" 72, "wght" 600;
  font-size:22px;
  line-height:1.1;
  letter-spacing:-0.02em;
}
.asset-val .d{
  font-size:13px;
  margin-top:3px;
}
.asset-grid-stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding-top:14px;
  border-top:1px solid var(--line);
}
.stat-label{font-size:12px; color:var(--muted); margin-bottom:4px;}
.stat-val{font-size:16px; font-weight:600;}

.asset-expand{
  margin-top:4px;
  padding:10px 14px;
  background:var(--surface-2);
  color:var(--ink-2);
  border-radius:10px;
  font-size:13.5px;
  font-weight:500;
  display:flex;
  align-items:center;
  justify-content:space-between;
  transition:background .15s;
}
.asset-expand:hover{background:var(--accent-soft); color:var(--accent);}
.asset-expand svg{width:14px; height:14px;}

/* =========================================================================
   ESTADO VAZIO — convite, não tristeza
   ========================================================================= */
.empty{
  padding:48px 32px;
  border:1.5px dashed var(--line-strong);
  border-radius:20px;
  text-align:center;
}
.empty h3{
  font-family:var(--f-serif);
  font-weight:600;
  font-size:24px;
  letter-spacing:-0.02em;
  margin:0 0 8px;
}
.empty p{color:var(--muted); margin:0 auto 24px; max-width:36ch; font-size:15px;}

/* =========================================================================
   DRAWER / SHEET — detalhes do ativo
   ========================================================================= */
.sheet-backdrop{
  position:fixed; inset:0; z-index:40;
  background: rgba(18, 32, 24, 0.55);
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; transition:opacity .2s;
}
.sheet-backdrop.open{opacity:1}
.sheet{
  width:100%;
  max-width:560px;
  max-height:92dvh;
  overflow-y:auto;
  background:var(--surface);
  border-radius:22px 22px 0 0;
  padding: 20px 24px calc(32px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);
  transition:transform .25s cubic-bezier(.2,.9,.3,1);
  box-shadow: 0 -20px 60px rgba(0,0,0,.25);
}
.sheet-backdrop.open .sheet{transform:translateY(0)}
.sheet-handle{
  width:36px; height:4px; border-radius:4px;
  background:var(--line-strong);
  margin:0 auto 16px;
}
.sheet-head{
  display:flex; justify-content:space-between; align-items:flex-start;
  margin-bottom:20px;
}
.sheet-head .ticker{font-size:22px;}
.sheet-head .asset-name{font-size:14px; margin-top:4px;}
.close-btn{
  width:32px; height:32px;
  border-radius:50%;
  background:var(--surface-2);
  color:var(--ink-2);
  display:grid; place-items:center;
  flex-shrink:0;
}
.close-btn:hover{background:var(--line);}

.sheet-value{
  font-family:var(--f-serif);
  font-variation-settings: "opsz" 144, "wght" 600;
  font-size:36px;
  letter-spacing:-0.03em;
  line-height:1;
  margin-bottom:8px;
}
.sheet-section{margin:28px 0 0;}
.sheet-section-title{
  font-family:var(--f-serif);
  font-weight:600;
  font-size:17px;
  letter-spacing:-0.01em;
  margin:0 0 14px;
  color:var(--ink);
}
.sheet-section-sub{color:var(--muted); font-size:13px; margin:-10px 0 14px;}

.kv-list{display:grid; gap:0;}
.kv-list > div{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding:11px 0;
  border-bottom:1px solid var(--line);
  font-size:14px;
}
.kv-list > div:last-child{border-bottom:0;}
.kv-list span{color:var(--muted);}
.kv-list b{font-weight:600; color:var(--ink);}

/* Comparação com Selic — barras */
.compare{display:grid; gap:14px;}
.compare-row{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:baseline;}
.compare-row .label{font-size:13.5px; color:var(--ink-2);}
.compare-row .val{font-family:var(--f-mono); font-weight:600; font-size:14px;}
.compare-bar{
  grid-column:1 / -1;
  height:8px;
  background:var(--surface-2);
  border-radius:4px;
  overflow:hidden;
  margin-top:-6px;
}
.compare-bar > span{
  display:block; height:100%; border-radius:4px;
  background:var(--accent); transition:width .5s ease-out;
}
.compare-bar.selic > span{background:var(--amber);}
.compare-note{
  margin-top:14px;
  padding:12px 14px;
  background:var(--surface-2);
  border-radius:10px;
  font-size:13.5px;
  color:var(--ink-2);
}

.sheet-actions{
  display:flex; gap:10px; flex-wrap:wrap;
  margin-top:28px;
}
.sheet-actions .btn{flex:1 1 140px;}

/* =========================================================================
   AUTOCOMPLETE — momento mágico
   ========================================================================= */
.search-box{position:relative;}
.search-input{
  padding-right:40px;
  font-family:var(--f-sans);
}
.search-spinner{
  position:absolute; right:14px; top:50%;
  transform:translateY(-50%);
  width:14px; height:14px;
  border-radius:50%;
  border:2px solid var(--line);
  border-top-color:var(--accent);
  animation:spin .8s linear infinite;
  display:none;
}
.search-spinner.on{display:block;}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}

.suggestions{
  position:absolute;
  top:calc(100% + 6px); left:0; right:0;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow: 0 20px 40px -20px rgba(18,32,24,.25);
  overflow:hidden;
  z-index:5;
  max-height:320px;
  overflow-y:auto;
}
.sugg-item{
  display:flex; align-items:center; gap:12px;
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  transition:background .1s;
}
.sugg-item:last-child{border-bottom:0;}
.sugg-item:hover, .sugg-item[aria-selected="true"]{background:var(--surface-2);}
.sugg-ticker{
  font-family:var(--f-mono);
  font-weight:600;
  font-size:14px;
  min-width:72px;
}
.sugg-name{
  flex:1; min-width:0;
  font-size:13.5px;
  color:var(--ink-2);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.sugg-kind{
  font-size:11px;
  color:var(--muted);
  padding:2px 8px;
  border:1px solid var(--line);
  border-radius:999px;
  flex-shrink:0;
}

/* Painel do ativo escolhido */
.picked{
  padding:16px;
  background:var(--accent-soft);
  border-radius:12px;
  margin-top:14px;
}
.picked-head{
  display:flex; justify-content:space-between; align-items:baseline;
  margin-bottom:8px;
}
.picked-head .ticker{font-size:17px; color:var(--accent);}
.picked-price{
  font-family:var(--f-serif);
  font-weight:600;
  font-size:20px;
  color:var(--accent);
}
.picked-meta{font-size:13px; color:var(--ink-2);}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
.form-grid .field{margin:0;}

.preview-note{
  margin-top:14px;
  padding:12px 14px;
  background:var(--surface-2);
  border-radius:10px;
  font-size:14px;
  color:var(--ink-2);
}
.preview-note b{color:var(--ink);}

/* =========================================================================
   DICAS EM ACCORDION
   ========================================================================= */
.tips{display:grid; gap:8px;}
details.tip{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}
details.tip[open]{border-color:var(--line-strong);}
details.tip > summary{
  list-style:none;
  padding:16px 18px;
  display:flex;
  align-items:center;
  gap:14px;
  cursor:pointer;
  font-weight:500;
  font-size:15px;
}
details.tip > summary::-webkit-details-marker{display:none;}
details.tip .tip-dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--muted);
  flex-shrink:0;
}
details.tip.warn .tip-dot{background:var(--loss);}
details.tip.info .tip-dot{background:var(--accent);}
details.tip .chev{
  margin-left:auto;
  color:var(--muted);
  transition:transform .2s;
  flex-shrink:0;
}
details.tip[open] .chev{transform:rotate(180deg);}
details.tip .tip-body{
  padding:0 18px 18px 40px;
  color:var(--ink-2);
  font-size:14.5px;
  line-height:1.6;
}
details.tip .tip-body p{margin:0 0 8px;}
details.tip .tip-body p:last-child{margin:0;}

/* =========================================================================
   TOAST
   ========================================================================= */
.toast{
  position:fixed;
  left:50%; bottom:calc(28px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%) translateY(16px);
  background:var(--ink);
  color:var(--bg);
  padding:12px 18px;
  border-radius:999px;
  font-size:14px;
  font-weight:500;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
  opacity:0;
  transition:opacity .2s, transform .2s;
  z-index:60;
  pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* =========================================================================
   RESPONSIVO
   ========================================================================= */
@media (min-width: 680px){
  .asset-grid{grid-template-columns: 1fr 1fr;}
  .sheet{align-self:center; max-height:85dvh; border-radius:22px;}
  .sheet-backdrop{align-items:center;}
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
  .live-dot{animation:none;}
}

/* =========================================================================
   PERFIL + TIPOS DE ATIVO + RENDA FIXA (NOVO)
   ========================================================================= */
.perfil-card{
  background: linear-gradient(135deg, var(--accent-soft), var(--surface-2));
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 22px 24px;
  display: grid;
  gap: 10px;
}
.perfil-badge{
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12.5px; font-weight: 600;
  padding: 4px 11px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink);
  width: fit-content;
}
.perfil-name{
  font-family: var(--f-serif); font-weight: 600;
  font-size: 22px; letter-spacing: -0.015em;
  margin: 2px 0 0;
}
.perfil-desc{color: var(--ink-2); font-size: 14.5px; margin: 0;}
.perfil-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top: 6px;}
.perfil-chip{
  font-size: 12px; padding: 3px 10px;
  background: var(--surface); color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 999px;
}
.perfil-cta{
  display:flex; gap:8px; align-items:center; justify-content:space-between;
  margin-top: 8px;
}
.perfil-cta small{font-size:12.5px; color:var(--muted);}

/* tiles para escolher tipo de ativo ao adicionar */
.type-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}
.type-tile{
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 16px 14px;
  text-align: left;
  cursor: pointer;
  display: grid; gap: 4px;
  transition: border-color .15s, transform .15s;
}
.type-tile:hover{border-color: var(--accent); transform: translateY(-1px);}
.type-tile .ic{
  width: 32px; height: 32px; border-radius: 10px;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center;
  font-weight: 700; font-size: 13px;
  margin-bottom: 4px;
}
.type-tile .ic.rf{background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber);}
.type-tile .tt{font-weight: 600; font-size: 15px;}
.type-tile .tds{font-size: 12.5px; color: var(--muted);}

/* seletor de segmento para estimativa de dividendo */
.seg-opts{display:grid; gap:6px; margin-top:8px;}
.seg-opt{
  display:flex; justify-content:space-between; align-items:center;
  padding: 10px 12px; border-radius:10px;
  background:var(--surface-2); cursor:pointer;
  border: 1.5px solid transparent;
}
.seg-opt:hover{background: var(--accent-soft);}
.seg-opt.sel{border-color: var(--accent); background: var(--accent-soft);}
.seg-opt .nm{font-weight: 500; font-size: 14px;}
.seg-opt .rt{font-family: var(--f-mono); font-size: 13px; color: var(--ink-2);}

/* questionário - progresso */
.quiz-head{display:flex; justify-content:space-between; align-items:baseline; margin: 4px 0 14px;}
.quiz-pillar{font-size:12.5px; color:var(--muted); text-transform:lowercase;}
.quiz-prog{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
.quiz-bar{height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin-bottom:18px;}
.quiz-bar > div{height:100%; background:var(--accent); transition:width .3s;}
.quiz-q{font-family:var(--f-serif); font-weight:600; font-size:20px; letter-spacing:-0.01em; margin:0 0 8px;}
.quiz-hint{color:var(--muted); font-size:14px; margin:0 0 18px;}
.quiz-opts{display:grid; gap:10px;}
.quiz-opt{
  padding: 14px 16px; border-radius: 12px;
  background: var(--surface-2); border: 1.5px solid var(--line);
  cursor: pointer; text-align: left;
  font-size: 14.5px; line-height: 1.4;
  transition: border-color .15s, background .15s;
}
.quiz-opt:hover{border-color: var(--accent);}
.quiz-opt.sel{border-color: var(--accent); background: var(--accent-soft); color: var(--accent);}
.quiz-nav{display:flex; justify-content:space-between; gap:10px; margin-top:22px;}

/* dicas por categoria (acionáveis) */
details.tip.urgent{border-left: 3px solid var(--loss); background: color-mix(in srgb, var(--loss) 6%, var(--surface));}
details.tip.action{border-left: 3px solid var(--accent);}
details.tip .tip-tag{
  font-size: 11px; font-weight: 700;
  color: var(--muted); margin-left: auto;
  margin-right: 6px;
}
details.tip.urgent .tip-tag{color: var(--loss);}
details.tip.action .tip-tag{color: var(--accent);}

/* badges nos cards de ativo para identificar tipo */
.asset-kind{
  display:inline-flex; align-items:center; gap:4px;
  font-size: 11px; font-weight: 700;
  color: var(--muted);
  padding: 2px 8px; border-radius: 999px;
  background: var(--surface-2);
  margin-bottom: 4px;
}
.asset-kind.fii{color: var(--accent); background: var(--accent-soft);}
.asset-kind.acao{color: #6B4FD4; background: color-mix(in srgb, #6B4FD4 15%, transparent);}
.asset-kind.rf{color: var(--amber); background: color-mix(in srgb, var(--amber) 15%, transparent);}
.asset-kind.fundo{color: #0C8599; background: color-mix(in srgb, #0C8599 15%, transparent);}

/* resumo de dividendos no detalhe */
.div-estimate{
  background: var(--accent-soft);
  border-radius: 12px;
  padding: 14px 16px;
  margin: 8px 0;
}
.div-estimate .vl{
  font-family: var(--f-serif); font-weight: 600; font-size: 22px;
  color: var(--accent); letter-spacing: -0.01em;
}
.div-estimate .lb{font-size:13px; color: var(--ink-2); margin-top:2px;}

</style>

<script type="module">
import { api } from './api.js';

// =========================================================================
// DADOS DE REFERÊNCIA (pesquisados em outubro/2026)

// DY médio por segmento de FII (fonte: Renova Invest + IFIX, jun/2026)
// Usado quando usuário não informa o dividendo manual.
const SEGMENT_DY = {

// Taxas de referência (atualize em "Mercado" quando precisar)
const TAXAS = {
  selic: 13.75,     // % a.a. - meta Copom

// Tabela regressiva de IR para renda fixa (dias → alíquota %)
const IR_TABELA = [

// Questionário de perfil - 4 pilares (base Anbima + comportamental)
const PERGUNTAS = [
  // PILAR 1: SITUAÇÃO FINANCEIRA
  { pilar: 'Sua situação', k:'renda', q:'Qual sua situação de renda hoje?',
    opts: [

    ]},

    opts: [
      { l:'Não tenho reserva nenhuma', pts:{reserva:0, urgent:+2} },

      { l:'Tenho 6+ meses tranquilo', pts:{reserva:3, conserv:-1} },

  { pilar: 'Sua situação', k:'dividas', q:'Você tem dívidas com juros altos (cartão, crediário, cheque especial)?',

      { l:'Não tenho dívida', pts:{dividas:3} },
    ]},

  // PILAR 2: OBJETIVOS
  { pilar: 'Seus objetivos', k:'objetivo', q:'Qual seu principal objetivo com os investimentos?',
    opts: [
      { l:'Guardar para uma compra grande em até 2 anos', pts:{obj:'curto', conserv:+2} },
      { l:'Construir patrimônio para médio prazo (3-10 anos)', pts:{obj:'medio'} },
      { l:'Independência financeira / aposentadoria (10+ anos)', pts:{obj:'longo', conserv:-1} },
      { l:'Gerar renda mensal (viver de dividendos)', pts:{obj:'renda'} },
    ]},
  { pilar: 'Seus objetivos', k:'prazo', q:'Em quanto tempo você pretende precisar desse dinheiro?',
    opts: [
      { l:'Posso precisar nos próximos 12 meses', pts:{prazo:0, conserv:+3} },

      { l:'Daqui 3 a 10 anos', pts:{prazo:2} },
      { l:'Não vou precisar tão cedo (10+ anos)', pts:{prazo:3, conserv:-2} },
    ]},
  { pilar: 'Seus objetivos', k:'aporte', q:'Quanto você consegue investir por mês?',
    opts: [
      { l:'Menos de R$ 300', pts:{aporte:0} },
      { l:'R$ 300 a R$ 1.000', pts:{aporte:1} },
      { l:'R$ 1.000 a R$ 3.000', pts:{aporte:2} },
      { l:'Mais de R$ 3.000', pts:{aporte:3} },
    ]},

  // PILAR 3: CONHECIMENTO
  { pilar: 'Seu conhecimento', k:'experiencia', q:'Há quanto tempo você investe?',
    opts: [
      { l:'Estou começando agora', pts:{exp:0, conserv:+1} },
      { l:'Menos de 1 ano', pts:{exp:1} },
      { l:'1 a 3 anos', pts:{exp:2} },
      { l:'Mais de 3 anos', pts:{exp:3, conserv:-1} },
    ]},
  { pilar: 'Seu conhecimento', k:'produtos', q:'Com quais produtos você já operou?',
    hint:'Pensa em quais você entende, não só os que tem conta.',
    opts: [

      { l:'Poupança e CDB/Tesouro', pts:{conhec:1} },
      { l:'FIIs, ações básicas, fundos', pts:{conhec:2} },
      { l:'Opções, debêntures, exterior', pts:{conhec:3, conserv:-1} },
    ]},
  { pilar: 'Seu conhecimento', k:'escolhe_fii', q:'Como você costuma escolher um FII?',
    opts: [
      { l:'Sigo quem paga mais dividendo no último mês', pts:{escolha:0, yieldtrap:+2} },
      { l:'Pela recomendação de influencers/corretora', pts:{escolha:1, yieldtrap:+1} },
      { l:'Olho P/VP, vacância, qualidade dos imóveis', pts:{escolha:2} },

  // PILAR 4: COMPORTAMENTO SOB RISCO
  { pilar: 'Como você reage', k:'queda', q:'Imagine que você investiu R$ 10.000 e, com uma crise, o valor cai para R$ 7.500 em um mês. O que faz?',
    opts: [
      { l:'Vendo tudo para não perder mais', pts:{reacao:0, panico:+3} },
      { l:'Vendo uma parte para proteger', pts:{reacao:1, panico:+1} },

      { l:'Compro mais, aproveitando preço baixo', pts:{reacao:3, conserv:-1} },

  { pilar: 'Como você reage', k:'perda', q:'Qual perda máxima você aguentaria num ano sem perder o sono?',
    opts: [

  { pilar: 'Como você reage', k:'checagem', q:'Com que frequência você acompanha o preço dos seus investimentos?',
    hint:'Pessoas que olham muito tendem a vender no pior momento.',
    opts: [
      { l:'Várias vezes ao dia', pts:{check:0, ansioso:+2} },
      { l:'Uma vez por dia', pts:{check:1, ansioso:+1} },
      { l:'Uma vez por semana', pts:{check:2} },
      { l:'Mensalmente ou menos', pts:{check:3} },
    ]},
  { pilar: 'Como você reage', k:'liquidez', q:'Se um imprevisto grande acontecer amanhã (saúde, família), quanto do seu dinheiro investido você precisaria resgatar?',
    opts: [
      { l:'Mais de 50% - preciso de muita liquidez', pts:{liq:0, conserv:+2} },
      { l:'Até 30%', pts:{liq:1} },
      { l:'Menos de 10%, tenho reserva separada', pts:{liq:2, conserv:-1} },
      { l:'Nada, meus investimentos são para longo prazo', pts:{liq:3, conserv:-2} },
    ]},

// =========================================================================


/* ---------------------------------------------------------------- helpers */
const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const brl = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
const pct = new Intl.NumberFormat('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 });
const toNum = (v) => { v = String(v||'').replace(/\./g,'').replace(',','.'); const n = parseFloat(v); return isNaN(n) ? 0 : n; };

const toast = (msg) => {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
};

/* ---------------------------------------------------------------- estado */
let state = { version: 0, positions: [], profile: null, legacy: null, settings: null, hist: [] };
let authMode = 'login';

/* ---------------------------------------------------------------- tema */
try { const t = localStorage.getItem('tema'); if (t) document.documentElement.setAttribute('data-theme', t); } catch(e){}
$('themeBtn').onclick = () => {
  let cur = document.documentElement.getAttribute('data-theme');
  if (!cur) cur = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('tema', next); } catch(e){}
};

/* ---------------------------------------------------------------- login */
$('toggleBtn').onclick = () => {
  authMode = authMode === 'login' ? 'register' : 'login';
  const reg = authMode === 'register';
  $('authTitle').textContent = reg ? 'Criar conta' : 'Entrar';
  $('authSub').textContent = reg ? 'Em menos de um minuto você começa a acompanhar.' : 'Fundos imobiliários, Tesouro Selic e ações — em um só lugar.';
  $('authBtn').textContent = reg ? 'Criar conta' : 'Entrar';
  $('toggleText').textContent = reg ? 'Já tem conta?' : 'Ainda não tem conta?';
  $('toggleBtn').textContent = reg ? 'Entrar' : 'Criar conta';
  $('password').autocomplete = reg ? 'new-password' : 'current-password';
  $('password').placeholder = reg ? 'mínimo 8 caracteres' : 'sua senha';
  $('authErr').textContent = '';
};

$('authForm').onsubmit = async (e) => {
  e.preventDefault();
  const email = $('email').value.trim(), password = $('password').value;
  $('authErr').textContent = ''; $('authBtn').disabled = true;
  try {
    await (authMode === 'register' ? api.register(email, password) : api.login(email, password));
    await enterApp();
  } catch (err) {
    const msgs = {
      email_em_uso: 'Esse e-mail já tem conta. Faça login.',
      credenciais_invalidas: 'E-mail ou senha incorretos.',
      senha_curta: 'A senha precisa de ao menos 8 caracteres.',
      email_invalido: 'E-mail inválido.',
      dados_invalidos: 'Confira os dados e tente de novo.',
    };
    $('authErr').textContent = msgs[err.data?.error] || 'Não foi possível concluir. Tente de novo.';
  } finally { $('authBtn').disabled = false; }
};

$('logoutBtn').onclick = async () => { await api.logout().catch(()=>{}); location.reload(); };

async function enterApp(){
  try { state = await api.getPortfolio(); }
  catch { state = { version:0, positions:[], profile:null, hist:[] }; }
  $('auth').classList.add('hide');
  $('app').classList.remove('hide');
  render();
  // uma única animação orquestrada: contar o patrimônio
  countUpHero();
}

async function persist(){
  try { const r = await api.savePortfolio(state); state.version = r.version; }
  catch (err) {
    if (err.status === 409) { toast('Carteira atualizada em outro aparelho'); setTimeout(async () => { state = await api.getPortfolio(); render(); }, 900); }
    else toast('Não consegui salvar');
  }
}

/* ---------------------------------------------------------------- cálculos */
// Enriquece posição: FII/ação OU renda fixa
function enrich(p){
  if (p.ticker) {
    const inv = p.q * p.c;
    const atual = p.q * (p.a ?? p.c);
    // dividendo: usa o informado OU estima pelo segmento (FII) OU 0 (ação sem info)
    const divUnit = (p.d > 0) ? p.d : (p.kind === 'fii' ? estimarDividendoPorCota(p) : 0);
    const renda = p.q * divUnit;
    return { inv, atual, ganho: atual - inv, pct: inv > 0 ? (atual - inv) / inv * 100 : 0, renda, divUnit, isMarket: true };
  }
  // renda fixa / fundos
  return calcRendaFixa(p);
}

// Estima dividendo mensal por cota com base no segmento do FII e preço atual
function estimarDividendoPorCota(p){
  if (p.kind !== 'fii') return 0;
  const seg = p.segment || p.seg || 'tijolo_log';
  const info = SEGMENT_DY[seg] || SEGMENT_DY.tijolo_log;
  const preco = p.a ?? p.c ?? 0;
  // mes é % do preço atual (ex: 0.83 = 0.83%/mês ≈ 10%/ano)
  return preco * info.mes / 100;
}

// Calcula valor atual + rendimento mensal projetado para renda fixa
function calcRendaFixa(p){
  const inv = p.ap || 0;
  if (inv <= 0) return { inv:0, atual:0, ganho:0, pct:0, renda:0, isMarket:false };
  const taxaAA = taxaEfetivaAnual(p);
  const dias = diasAplicado(p);
  // valor bruto: capitalização diária composta
  const bruto = inv * Math.pow(1 + taxaAA/100, dias/365);
  // IR regressivo (não aplica LCI/LCA)
  const isento = (p.kind === 'lci' || p.kind === 'lca');
  const rendimento = bruto - inv;
  const ir = isento ? 0 : rendimento * irPorDias(dias) / 100;
  const atual = bruto - ir;
  // renda mensal projetada: diferença entre o valor em +30d e hoje (líq.)
  const bruto30 = inv * Math.pow(1 + taxaAA/100, (dias+30)/365);
  const ir30 = isento ? 0 : (bruto30 - inv) * irPorDias(dias+30) / 100;
  const atual30 = bruto30 - ir30;
  const renda = Math.max(0, atual30 - atual);
  return { inv, atual, ganho: atual - inv, pct: inv > 0 ? (atual - inv) / inv * 100 : 0, renda, isMarket:false, taxaAA, dias, ir };
}

// Taxa efetiva anual (%) para cada tipo de renda fixa
function taxaEfetivaAnual(p){
  const kind = p.kind;
  const tx = Number(p.taxa) || 0;
  if (kind === 'selic')  return TAXAS.selic;
  if (kind === 'cdi')    return TAXAS.cdi * (tx/100 || 1);   // ex: 110% do CDI
  if (kind === 'lci' || kind === 'lca') return TAXAS.cdi * (tx/100 || 0.9);
  if (kind === 'pre')    return tx || TAXAS.pre_curto;
  if (kind === 'ipca')   return TAXAS.ipca + (tx || TAXAS.ipca_longo);
  if (kind === 'cdb')    return TAXAS.cdi * (tx/100 || 1);
  if (kind === 'fundo')  return tx || 10;
  return tx || TAXAS.selic;
}

// Dias desde a data de aplicação
function diasAplicado(p){
  if (!p.dt) return 1;
  const ini = new Date(p.dt);
  const hoje = new Date();
  const d = Math.max(1, Math.floor((hoje - ini) / 86400000));
  return d;
}

// Alíquota de IR regressiva pelo prazo
function irPorDias(dias){
  for (const t of IR_TABELA) if (dias <= t.ate) return t.aliq;
  return 15;
}

function totals(){
  return state.positions.reduce((t, p) => {
    const r = enrich(p);
    t.inv += r.inv; t.atual += r.atual; t.renda += r.renda;
    return t;
  }, { inv:0, atual:0, renda:0 });
}

/* ---------------------------------------------------------------- render hero */
function render(){
  const t = totals();
  const ganho = t.atual - t.inv;
  const pctg = t.inv > 0 ? ganho/t.inv*100 : 0;

  $('heroValue').textContent = brl.format(t.atual);
  $('heroValue').dataset.target = t.atual;

  const pill = $('heroPill');
  if (state.positions.length === 0){
    pill.className = 'pill'; pill.textContent = 'Carteira vazia';
  } else {
    pill.className = 'pill ' + (ganho >= 0 ? 'gain' : 'loss');
    pill.textContent = (ganho >= 0 ? '+ ' : '− ') + brl.format(Math.abs(ganho)) + ' (' + (ganho>=0?'+':'−') + pct.format(Math.abs(pctg)) + '%)';
  }
  const n = state.positions.length;
  const meta = [];
  if (n > 0) meta.push(n + (n===1 ? ' ativo' : ' ativos'));
  if (t.renda > 0) meta.push(brl.format(t.renda) + '/mês projetado');
  $('heroMeta').textContent = meta.join(' · ');

  $('assetsSub').textContent = n > 0 ? 'Cotações atualizadas automaticamente.' : '';

  renderAssets();
  renderProfile();
  renderTips();
  $('heroUpd').textContent = n > 0 ? 'ao vivo' : '';
}

function countUpHero(){
  const el = $('heroValue');
  const target = Number(el.dataset.target || 0);
  if (!target || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const start = performance.now(), dur = 900;
  const tick = (now) => {
    const p = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = brl.format(target * eased);
    if (p < 1) requestAnimationFrame(tick);
    else el.textContent = brl.format(target);
  };
  requestAnimationFrame(tick);
}

/* ---------------------------------------------------------------- sheet infra */
function openSheet(buildBody){
  const host = $('sheetHost');
  const bd = el('div', 'sheet-backdrop');
  const sheet = el('div', 'sheet');
  sheet.appendChild(el('div', 'sheet-handle'));
  bd.appendChild(sheet);
  host.appendChild(bd);
  const close = () => {
    bd.classList.remove('open');
    setTimeout(() => bd.remove(), 250);
    document.removeEventListener('keydown', key);
  };
  const key = (e) => { if (e.key === 'Escape') close(); };
  bd.addEventListener('click', (e) => { if (e.target === bd) close(); });
  document.addEventListener('keydown', key);
  requestAnimationFrame(() => bd.classList.add('open'));
  buildBody(sheet, close);
  return close;
}

/* ---------------------------------------------------------------- detalhes do ativo */
function openDetails(p){
  openSheet((body, close) => {
    const r = enrich(p);
    const kindFull = (
      p.kind === 'acao'  ? 'Ação' :
      p.kind === 'fii'   ? 'Fundo imobiliário' :
      p.kind === 'selic' ? 'Tesouro Selic' :
      p.kind === 'pre'   ? 'Tesouro Prefixado' :
      p.kind === 'ipca'  ? 'Tesouro IPCA+' :
      p.kind === 'cdb'   ? 'CDB' :
      p.kind === 'lci'   ? 'LCI (isento de IR)' :
      p.kind === 'lca'   ? 'LCA (isento de IR)' :
      p.kind === 'fundo' ? 'Fundo de investimento' : 'Ativo'
    );

    const head = el('div', 'sheet-head');
    const left = el('div');
    const tk = el('div', 'ticker', p.ticker || p.nome || kindFull);
    left.appendChild(tk);
    left.appendChild(el('div', 'asset-name', p.name || kindFull));
    const cb = el('button', 'close-btn'); cb.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    cb.onclick = close;
    head.appendChild(left); head.appendChild(cb);
    body.appendChild(head);

    body.appendChild(el('div', 'sheet-value num', brl.format(r.atual)));
    if (r.isMarket){
      const pill = el('span', 'pill ' + (r.ganho >= 0 ? 'gain' : 'loss'),
        (r.ganho >= 0 ? '+ ' : '− ') + brl.format(Math.abs(r.ganho)) + ' (' + pct.format(Math.abs(r.pct)) + '%)');
      body.appendChild(pill);
    } else if (r.ganho > 0){
      const pill = el('span', 'pill gain',
        '+ ' + brl.format(r.ganho) + ' (' + pct.format(r.pct) + '%)');
      body.appendChild(pill);
    }

    /* Destaque do dividendo estimado (FIIs sem dividendo informado) */
    if (p.ticker && p.kind === 'fii' && !(p.d > 0) && r.divUnit > 0){
      const info = SEGMENT_DY[p.segment || 'tijolo_log'];
      const est = el('div', 'div-estimate');
      est.appendChild(el('div', 'vl', brl.format(r.renda) + '/mês'));
      est.appendChild(el('div', 'lb', 'estimativa com base no segmento ' + (info?.nome || p.segment) + ' (' + (info?.faixa || '') + ')'));
      body.appendChild(est);
    }

    /* Comparação com Tesouro Selic (base 13,75% a.a.) */
    if (p.ticker && r.inv > 0){
      const selicAnnual = TAXAS.selic;
      const selicProj = r.inv * selicAnnual / 100 * 0.85; // 15% IR
      const assetProj = r.renda * 12;
      const max = Math.max(assetProj, selicProj, 0.01);

      const sec = el('div', 'sheet-section');
      sec.appendChild(el('h3', 'sheet-section-title', 'Comparação em 12 meses'));
      sec.appendChild(el('p', 'sheet-section-sub', 'Rendimento esperado se nada mudar. Base: Selic ' + pct.format(selicAnnual) + '%, já descontado o IR.'));

      const cmp = el('div', 'compare');
      const r1 = el('div', 'compare-row');
      r1.appendChild(el('div', 'label', p.ticker + ' (dividendos)'));
      r1.appendChild(el('div', 'val', brl.format(assetProj)));
      const b1 = el('div', 'compare-bar'); const s1 = el('span'); s1.style.width = (assetProj/max*100) + '%'; b1.appendChild(s1);
      r1.appendChild(b1);
      cmp.appendChild(r1);

      const r2 = el('div', 'compare-row');
      r2.appendChild(el('div', 'label', 'Tesouro Selic'));
      r2.appendChild(el('div', 'val', brl.format(selicProj)));
      const b2 = el('div', 'compare-bar selic'); const s2 = el('span'); s2.style.width = (selicProj/max*100) + '%'; b2.appendChild(s2);
      r2.appendChild(b2);
      cmp.appendChild(r2);
      sec.appendChild(cmp);

      const diff = assetProj - selicProj;
      const note = el('div', 'compare-note');
      if (Math.abs(diff) < 1) note.textContent = 'Rendimento parecido com o do Tesouro Selic.';
      else if (diff > 0) note.innerHTML = 'Seu ativo renderia <b>' + brl.format(diff) + '</b> a mais que o Tesouro Selic no período. Lembre que o preço da cota pode subir ou cair.';
      else note.innerHTML = 'Seu ativo renderia <b>' + brl.format(-diff) + '</b> a menos que o Tesouro Selic no período, mas a cota pode se valorizar.';
      sec.appendChild(note);
      body.appendChild(sec);
    }

    /* Detalhes técnicos */
    const tech = el('div', 'sheet-section');
    tech.appendChild(el('h3', 'sheet-section-title', 'Detalhes técnicos'));
    const kv = el('div', 'kv-list');
    const row = (k, v) => { const d = el('div'); d.appendChild(el('span', null, k)); d.appendChild(el('b', 'num', v)); kv.appendChild(d); };
    if (p.ticker){
      row('Cotas', String(p.q));
      row('Preço médio pago', brl.format(p.c));
      row('Preço atual', brl.format(p.a ?? p.c));
      if (p.d > 0) row('Último dividendo (por cota)', brl.format(p.d));
      else if (p.kind === 'fii' && r.divUnit > 0) row('Dividendo estimado (cota)', brl.format(r.divUnit) + ' /mês');
      if (p.dy12 != null) row('Dividend Yield (12m)', pct.format(p.dy12) + '%');
      if (p.pvp != null) row('P/VP', pct.format(p.pvp));
      if (p.segment) {
        const si = SEGMENT_DY[p.segment];
        row('Segmento', si ? si.nome : p.segment);
      }
    } else {
      row('Tipo', kindFull);
      row('Valor aplicado', brl.format(p.ap || 0));
      row('Data da aplicação', p.dt ? new Date(p.dt).toLocaleDateString('pt-BR') : '—');
      row('Dias aplicado', String(r.dias || 0));
      row('Taxa efetiva (a.a.)', (r.taxaAA || 0).toFixed(2) + '%');
      // mostra como foi configurado
      if (p.kind === 'cdi' || p.kind === 'cdb') row('Rentabilidade', (p.taxa || 100) + '% do CDI');
      else if (p.kind === 'lci' || p.kind === 'lca') row('Rentabilidade', (p.taxa || 90) + '% do CDI (isento IR)');
      else if (p.kind === 'pre')  row('Taxa prefixada', (p.taxa || TAXAS.pre_curto) + '% a.a.');
      else if (p.kind === 'ipca') row('IPCA +', (p.taxa || TAXAS.ipca_longo) + '% a.a.');
      row('Rendimento bruto', brl.format(Math.max(0, (r.atual + (r.ir||0)) - r.inv)));
      if ((r.ir || 0) > 0) row('IR estimado (' + irPorDias(r.dias) + '%)', '− ' + brl.format(r.ir));
      row('Rendimento líquido', brl.format(r.ganho));
      row('Rendimento diário (média)', brl.format(r.renda / 30));
    }
    tech.appendChild(kv);
    body.appendChild(tech);

    /* Ações */
    const acts = el('div', 'sheet-actions');
    const rm = el('button', 'btn btn-ghost', 'Remover');
    rm.onclick = async () => {
      if (!confirm('Remover ' + (p.ticker || p.nome || 'esse ativo') + ' da carteira?')) return;
      state.positions = state.positions.filter(x => x.id !== p.id);
      close(); render(); await persist(); toast('Ativo removido');
    };
    acts.appendChild(rm);
    body.appendChild(acts);
  });
}

        segBox.appendChild(segOpts);
        estBtn.onclick = (e) => { e.preventDefault(); segBox.style.display = segBox.style.display === 'none' ? 'block' : 'none'; };
        divI.oninput = () => { userDiv = toNum(divI.value); };

        divBox.appendChild(estBtn);
        divBox.appendChild(segBox);
        picked.appendChild(divBox);
      }

      const prev = el('div', 'preview-note', 'Preencha quantidade e preço para ver o resumo.');
      prev.style.marginTop = '14px';
      picked.appendChild(prev);

      // busca cotação
      try {
        const q = await api.quote(r.ticker);
        chosen._price = q.price; chosen._d = q.last_dividend; chosen._dy = q.dy_12m; chosen._pvp = q.pvp;
        price.textContent = brl.format(q.price);
        if (q.last_dividend > 0 && r.kind === 'fii'){
          // backend tem dividendo real — usa esse
          const divInput = picked.querySelector('input[placeholder="0,10"]');
          if (divInput && !divInput.value){
            divInput.value = q.last_dividend.toFixed(2).replace('.', ',');
            userDiv = q.last_dividend;
          }
        }
      } catch { price.textContent = 'preço indisponível'; price.style.fontSize = '14px'; }

      const upd = () => {
        const Q = toNum(qtyI.value), C = toNum(prcI.value);
        if (Q <= 0 || C <= 0){ prev.textContent = 'Preencha quantidade e preço para ver o resumo.'; return; }
        const invested = Q * C;
        const current = Q * (chosen._price || C);
        const diff = current - invested;
        const dMes = (userDiv || chosen._d || 0) * Q;
        let txt = 'Você investiu <b>' + brl.format(invested) + '</b>. Hoje vale <b>' + brl.format(current) + '</b> ('
          + (diff >= 0 ? '+' : '−') + brl.format(Math.abs(diff)) + ').';
        if (dMes > 0) txt += '<br>Rendimento projetado: <b style="color:var(--gain)">' + brl.format(dMes) + '/mês</b>.';
        prev.innerHTML = txt;
      };
      qtyI.oninput = upd; prcI.oninput = upd;
      setTimeout(() => qtyI.focus(), 50);

      ok.onclick = async () => {
        const Q = toNum(qtyI.value), C = toNum(prcI.value);
        if (Q <= 0){ err.textContent = 'Informe a quantidade.'; return; }
        if (C <= 0){ err.textContent = 'Informe o preço médio pago.'; return; }
        if (state.positions.some(x => x.ticker === chosen.ticker)){ err.textContent = 'Esse ativo já está na sua carteira.'; return; }
        state.positions.push({
          id: crypto.randomUUID(),
          kind: chosen.kind === 'acao' ? 'acao' : 'fii',
          ticker: chosen.ticker, name: chosen.name,
          q: Q, c: C, a: chosen._price ?? C,
          d: (userDiv != null ? userDiv : (chosen._d ?? 0)),
          dy12: chosen._dy ?? null, pvp: chosen._pvp ?? null,
          segment: chosen.kind === 'fii' ? userSegment : null,
        });
        close(); render(); countUpHero(); toast('Ativo adicionado'); await persist();
      };
    };

    const showList = (results) => {
      closeList();
      if (!results.length) return;
      suggList = el('div', 'suggestions');
      results.forEach((r) => {
        const it = el('div', 'sugg-item');
        it.setAttribute('role', 'option');
        it.appendChild(el('div', 'sugg-ticker', r.ticker));
        it.appendChild(el('div', 'sugg-name', r.name));
        it.appendChild(el('div', 'sugg-kind', r.kind === 'acao' ? 'Ação' : r.kind === 'fii' ? 'FII' : r.kind.toUpperCase()));
        it.onmousedown = (e) => { e.preventDefault(); choose(r); };
        suggList.appendChild(it);
      });
      sb.appendChild(suggList);
      items = [...suggList.children];
    };

    inp.oninput = () => {
      chosen = null; picked.innerHTML = ''; ok.disabled = true; err.textContent = '';
      const q = inp.value.trim();
      clearTimeout(timer);
      if (q.length < 1){ closeList(); spin.classList.remove('on'); return; }
      spin.classList.add('on');
      timer = setTimeout(async () => {
        try { const r = await api.search(q); showList(r.results || []); }
        catch { closeList(); }
        finally { spin.classList.remove('on'); }
      }, 180);
    };
    inp.onkeydown = (e) => {
      if (!items.length) return;
      if (e.key === 'ArrowDown'){ e.preventDefault(); sel = (sel+1) % items.length; }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); sel = (sel-1+items.length) % items.length; }
      else if (e.key === 'Enter' && sel >= 0){ e.preventDefault(); items[sel].onmousedown(new Event('x')); return; }
      else return;
      items.forEach((it, i) => it.setAttribute('aria-selected', i === sel));
      items[sel].scrollIntoView({ block: 'nearest' });
    };

    setTimeout(() => inp.focus(), 80);
  });
}

// Agrega as respostas em um perfil + score
function computeProfile(answers){
  // Soma pontos de "conserv" - quanto maior, mais conservador o perfil deve ser
  let conserv = 0;
  let urgent = 0, yieldtrap = 0, panico = 0, ansioso = 0;
  const pts = {};
  for (const [k, idx] of Object.entries(answers)){
    const q = PERGUNTAS.find(p => p.k === k);
    if (!q || q.opts[idx] == null) continue;
    const p = q.opts[idx].pts || {};
    for (const [key, val] of Object.entries(p)){
      if (typeof val === 'number') pts[key] = (pts[key] || 0) + val;
      else pts[key] = val;
    }
    if (typeof p.conserv === 'number') conserv += p.conserv;
    if (typeof p.urgent === 'number') urgent += p.urgent;
    if (typeof p.yieldtrap === 'number') yieldtrap += p.yieldtrap;
    if (typeof p.panico === 'number') panico += p.panico;
    if (typeof p.ansioso === 'number') ansioso += p.ansioso;
  }
  let perfil, nome, desc;
  if (conserv >= 4){
    perfil = 'conservador';
    nome = 'Conservador';
    desc = 'Prioriza preservar capital e dormir tranquilo. Renda fixa deve ser a base.';
  } else if (conserv >= -2){
    perfil = 'moderado';
    nome = 'Moderado';
    desc = 'Aceita algum risco em troca de melhor rendimento. Mix equilibrado FII + renda fixa.';
  } else {
    perfil = 'arrojado';
    nome = 'Arrojado';
    desc = 'Confortável com oscilações para buscar mais retorno. Exposição maior em FII/ações.';
  }
  return { perfil, nome, desc, pts, conserv, urgent, yieldtrap, panico, ansioso, answers };
}

          answers[q.k] = oi;
          // avança sozinho pra fluir melhor
          if (i < PERGUNTAS.length - 1){ i++; render(); }
          else { finish(); }
        };
        opts.appendChild(btn);
      });
      body.appendChild(opts);

      const nav = el('div', 'quiz-nav');
      const back = el('button', 'btn btn-ghost', '← Anterior');
      back.disabled = i === 0;
      back.onclick = () => { i--; render(); };
      const next = el('button', 'btn', i === PERGUNTAS.length-1 ? 'Ver meu perfil' : 'Pular →');
      next.disabled = answers[q.k] == null && i < PERGUNTAS.length-1;
      next.onclick = () => {
        if (i < PERGUNTAS.length-1){ i++; render(); }
        else finish();
      };
      nav.appendChild(back); nav.appendChild(next);
      body.appendChild(nav);
    };

    const finish = async () => {
      // precisa responder ao menos 8 pra ter perfil
      const n = Object.keys(answers).length;
      if (n < 8){
        toast('Responda ao menos 8 perguntas pra gerar seu perfil (' + n + '/' + PERGUNTAS.length + ')');
        return;
      }
      const prof = computeProfile(answers);
      state.profile = prof;
      close();
      renderProfile();
      renderTips();
      toast('Perfil: ' + prof.nome);
      await persist();
    };

    render();
  });
}

// DICAS DINÂMICAS - mescla perfil + posições + mercado
// =========================================================================

function tipAccTag(title, cls, tag, bodyHtml){
  const d = document.createElement('details');
  d.className = 'tip' + (cls ? ' ' + cls : '');
  const sum = el('summary');
  sum.appendChild(el('span', 'tip-dot'));
  sum.appendChild(el('span', null, title));
  if (tag) sum.appendChild(el('span', 'tip-tag', tag));
  const chev = el('span', 'chev');
  chev.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
  sum.appendChild(chev);
  d.appendChild(sum);
  const b = el('div', 'tip-body'); b.innerHTML = bodyHtml;
  d.appendChild(b);
  return d;
}

function renderTips(){
  const box = $('tips'); box.innerHTML = '';
  const t = totals();
  const n = state.positions.length;
  const profile = state.profile;
  const tips = [];

  // ------- URGENTES (ação imediata) -------
  if (profile && profile.urgent >= 2){
    tips.push(tipAccTag(
      'Pague suas dívidas de juros alto antes de investir',
      'urgent', 'URGENTE',
      '<p>Suas respostas mostram que você tem dívidas pesando. Cartão de crédito e cheque especial cobram <b>mais de 300% ao ano</b> — nenhum investimento rende isso.</p>' +
      '<p><b>Ordem recomendada:</b></p><ol>' +
      '<li>Negociar e quitar dívidas de cartão/cheque especial</li>' +
      '<li>Fazer reserva de emergência (6 meses de gastos no Tesouro Selic)</li>' +
      '<li>Só depois começar com FII e ações</li></ol>' +
      '<p>Investir com dívida cara é como abastecer um balde furado.</p>'
    ));
  }

  if (profile && profile.pts.reserva === 0 && n > 0){
    tips.push(tipAccTag(
      'Você investe mas não tem reserva de emergência',
      'urgent', 'URGENTE',
      '<p>Reserva de emergência = dinheiro de resgate rápido pra cobrir <b>6 a 12 meses</b> dos seus gastos. Sem ela, qualquer imprevisto obriga você a vender ativo em prejuízo.</p>' +
      '<p><b>Onde fica:</b> Tesouro Selic ou CDB de liquidez diária em bancos grandes. Rende quase a Selic cheia (' + TAXAS.selic + '% a.a.) e você resgata em 1 dia útil.</p>' +
      '<p><b>Não serve:</b> FII, ação, Tesouro Prefixado, Tesouro IPCA — todos oscilam.</p>'
    ));
  }

  // ------- AÇÕES DA CARTEIRA -------
  state.positions.forEach(p => {
    const r = enrich(p);

    // yield trap: DY muito alto
    if (p.ticker && p.dy12 && p.dy12 > 15){
      tips.push(tipAccTag(
        p.ticker + ' pode ser yield trap',
        'warn', 'INVESTIGAR',
        '<p>Rendimento de <b>' + pct.format(p.dy12) + '% ao ano</b> está muito acima da média (FII bom paga 8-12%).</p>' +
        '<p><b>Yield trap</b> = o fundo paga muito porque o mercado tem medo de algo. Pode ser:</p>' +
        '<ul><li>Imóveis vagos ou com inquilino problemático</li><li>CRIs com risco de calote</li>' +
        '<li>Distribuição extraordinária que não vai se repetir</li></ul>' +
        '<p><b>Antes de aumentar a posição:</b> leia o relatório gerencial e veja se o DY vem só do aluguel/juros ou de ganho de capital pontual.</p>'
      ));
    }

    // P/VP alto
    if (p.ticker && p.pvp && p.pvp > 1.15){
      tips.push(tipAccTag(
        p.ticker + ' está pagando ágio (P/VP alto)',
        'warn', 'ATENÇÃO',
        '<p>P/VP de <b>' + pct.format(p.pvp) + '</b>: você paga ' + pct.format((p.pvp-1)*100) + '% a mais do que o patrimônio do fundo vale.</p>' +
        '<p>Para fundos de tijolo, isso costuma ser agressivo. Se o fundo tiver uma emissão nova, você provavelmente conseguirá a mesma cota mais barata.</p>' +
        '<p><b>Dica:</b> acompanhe os comunicados do fundo. Em emissões, o preço de referência costuma trazer o P/VP para perto de 1,00.</p>'
      ));
    }

    // Concentração
    if (p.ticker && t.atual > 0 && r.atual / t.atual > 0.25){
      tips.push(tipAccTag(
        p.ticker + ' concentra ' + pct.format(r.atual/t.atual*100) + '% da sua carteira',
        'action', 'DIVERSIFICAR',
        '<p>Você tem <b>' + pct.format(r.atual/t.atual*100) + '%</b> em um único ativo. Se algo der errado com ele (gestão, inadimplência, vacância), o estrago é grande.</p>' +
        '<p><b>Referência saudável:</b> no máximo 10-15% por ativo.</p>' +
        '<p><b>Como diversificar:</b> aporte novo em outros ativos até balancear. Vender só pra equilibrar costuma gerar imposto e corretagem desnecessários.</p>'
      ));
    }

    // Renda fixa com Prefixado longo e perfil conservador
    if (p.kind === 'pre' && profile && profile.perfil === 'conservador'){
      tips.push(tipAccTag(
        'Tesouro Prefixado tem risco pro seu perfil',
        'warn', 'ATENÇÃO',
        '<p>Prefixado <b>trava a taxa</b>. Se a Selic subir, você perde — porque fica preso num rendimento menor que o novo CDI.</p>' +
        '<p>Se precisar resgatar antes do vencimento, pode receber menos que investiu (marcação a mercado).</p>' +
        '<p><b>Alternativa pro conservador:</b> Tesouro Selic acompanha os juros em tempo real, sem surpresa.</p>'
      ));
    }
  });

  // ------- CARTEIRA GERAL -------

  // Carteira só FII sem renda fixa
  const temFii = state.positions.some(p => p.kind === 'fii');
  const temRf  = state.positions.some(p => ['selic','pre','ipca','cdb','lci','lca'].includes(p.kind));
  if (temFii && !temRf && n >= 2){
    tips.push(tipAccTag(
      'Sua carteira só tem FII',
      'action', 'EQUILIBRAR',
      '<p>FII é uma ótima classe, mas <b>oscila</b> com o mercado. Em crises, o preço da cota pode cair 20-30% em meses.</p>' +
      '<p><b>Base de renda fixa</b> (Tesouro Selic ou CDB) traz:</p>' +
      '<ul><li>Previsibilidade: você sabe quanto vai render</li>' +
      '<li>Liquidez: resgate em 1 dia</li>' +
      '<li>Oportunidade: dinheiro para comprar FII quando cair</li></ul>' +
      '<p>Mesmo pros arrojados, uma reserva de 20-30% em renda fixa é o padrão.</p>'
    ));
  }

  // Poucos ativos
  if (n > 0 && n < 5){
    tips.push(tipAccTag(
      'Você tem só ' + n + ' ' + (n===1?'ativo':'ativos') + ' — diversifique mais',
      'action', 'DIVERSIFICAR',
      '<p>Carteiras com 1-4 ativos ficam muito expostas a problemas específicos. O ideal:</p>' +
      '<ul><li><b>FII:</b> ao menos 6-8 ativos, misturando papel (CRI) e tijolo (imóveis)</li>' +
      '<li><b>Ações:</b> 10-15 empresas de setores diferentes</li>' +
      '<li><b>Renda fixa:</b> Tesouro + 1-2 CDBs/LCIs</li></ul>' +
      '<p>Não precisa comprar tudo hoje. Acrescente aos poucos conforme aporta.</p>'
    ));
  }

  // Perfil ansioso + muitos ativos de risco
  if (profile && profile.ansioso >= 2 && temFii){
    tips.push(tipAccTag(
      'Diminua a frequência que olha o preço',
      'info', 'HÁBITO',
      '<p>Você respondeu que olha preço todo dia. Isso <b>aumenta a chance de vender errado</b> — no vermelho, por emoção, no fundo do poço.</p>' +
      '<p><b>Prática que funciona:</b></p>' +
      '<ul><li>Olhar a carteira só no dia do aporte mensal</li>' +
      '<li>Agendar uma revisão trimestral (planilha + leitura dos relatórios)</li>' +
      '<li>Tirar o app da tela inicial do celular</li></ul>' +
      '<p>Preço oscila sempre. O que vale é o rendimento acumulado em anos.</p>'
    ));
  }

  // Perfil pânico
  if (profile && profile.panico >= 3){
    tips.push(tipAccTag(
      'Prepare-se mentalmente para quedas',
      'info', 'MINDSET',
      '<p>Suas respostas mostram que você venderia tudo numa queda de 25%. Isso é o pior erro de longo prazo: você <b>congela</b> o prejuízo.</p>' +
      '<p><b>Realidade histórica do Ibovespa:</b></p>' +
      '<ul><li>Queda de 20%+ acontece uns 3-4 anos em cada 10</li>' +
      '<li>Em todos os crashes, o mercado recuperou em 2-5 anos</li>' +
      '<li>Quem vendeu no fundo transformou perda temporária em perda real</li></ul>' +
      '<p><b>Regra:</b> só invista em FII/ação o que você <b>consegue não olhar por 5 anos</b>. O resto fica em Selic.</p>'
    ));
  }

  // Objetivo renda + sem FII
  if (profile && profile.pts.obj === 'renda' && !temFii){
    tips.push(tipAccTag(
      'Seu objetivo é renda — considere FII',
      'action', 'OPORTUNIDADE',
      '<p>Você quer gerar renda mensal, mas não tem FII. Fundos imobiliários pagam dividendos <b>mensais</b> e são a classe mais popular pra viver de renda.</p>' +
      '<p><b>Começar sem erro:</b></p>' +
      '<ul><li>Mix 50% papel (CRI) + 50% tijolo (imóveis)</li>' +
      '<li>Papel: liquidez e DY alto (12-14% a.a.). Ex: KNCR11, RBRR11, HGCR11</li>' +
      '<li>Tijolo logística: contratos longos. Ex: HGLG11, VILG11, BTLG11</li>' +
      '<li>Shopping/laje: mais cíclico mas potencial de valorização. Ex: XPML11, HGRE11</li></ul>' +
      '<p>Não é indicação de compra — é referência pra pesquisar.</p>'
    ));
  }

  // ------- CONCEITOS SEMPRE PRESENTES -------
  const concepts = [
    ['O que é Dividend Yield (DY)?',
     '<p>É quanto um ativo paga de rendimentos em relação ao preço da cota, nos últimos 12 meses.</p>' +
     '<p>Ex: um FII com DY de 10% ao ano significa que, se você investir R$ 1.000, deve receber cerca de R$ 100 em dividendos ao longo do ano.</p>' +
     '<p>É uma referência, não garantia. O valor pago pode mudar todo mês.</p>'],
    ['O que é P/VP?',
     '<p>Compara o preço da cota com o valor patrimonial do fundo.</p>' +
     '<p><b>P/VP = 1,00</b>: você paga exatamente o que vale o patrimônio.<br><b>Abaixo de 1,00</b>: compra com desconto.<br><b>Acima de 1,00</b>: compra com ágio.</p>' +
     '<p>Desconto não significa barganha — pode refletir algum problema. Ágio não significa roubo — pode ser um fundo muito bem avaliado.</p>'],
    ['Fundos de tijolo vs. papel',
     '<p><b>Tijolo</b>: investe em imóveis físicos (shoppings, galpões, lajes). O ganho vem do aluguel.</p>' +
     '<p><b>Papel</b>: investe em títulos de dívida ligados a imóveis (CRIs). O ganho vem dos juros.</p>' +
     '<p>Carteira equilibrada costuma ter os dois: tijolo dá exposição a imóveis reais, papel costuma pagar mais rendimento no curto prazo.</p>'],
    ['IR em renda fixa: por que varia?',
     '<p>Imposto segue tabela regressiva — quanto mais tempo você deixa, menos paga:</p>' +
     '<ul><li>Até 180 dias: 22,5%</li><li>181 a 360 dias: 20%</li>' +
     '<li>361 a 720 dias: 17,5%</li><li>Acima de 720 dias (2 anos): 15%</li></ul>' +
     '<p>Por isso Tesouro e CDB rendem mais quando você segura por mais de 2 anos.</p>' +
     '<p><b>Exceções:</b> LCI, LCA, debêntures incentivadas e poupança são isentos de IR.</p>'],
    ['Tesouro Selic vs. Prefixado vs. IPCA+',
     '<p><b>Selic:</b> acompanha os juros em tempo real. Nunca perde. Ideal pra reserva.</p>' +
     '<p><b>Prefixado:</b> taxa travada (hoje ~' + TAXAS.pre_curto + '%). Ganha se juros caírem, perde se subirem. Pode marcar prejuízo se resgatar antes.</p>' +
     '<p><b>IPCA+:</b> paga IPCA + taxa real (~' + TAXAS.ipca_longo + '%). Protege do aumento de preços. Bom pra longo prazo.</p>'],
    ['Por que a cotação muda sem eu fazer nada?',
     '<p>O preço do ativo é definido pelo mercado — por quanto as pessoas estão comprando e vendendo naquele momento.</p>' +
     '<p>Nosso sistema atualiza automaticamente a cada 5 minutos durante o pregão (10h às 18h). Fora desse horário, o preço fica congelado no último fechamento.</p>'],
  ];
  concepts.forEach(([t, b]) => tips.push(tipAccTag(t, 'info', 'CONCEITO', b)));

  tips.forEach(a => box.appendChild(a));
}
