<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup — Fintech Brasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F6F8;         /* branco-piscina */
  --surface:#FFFFFF;
  --ink:#1A2B2A;
  --dim:#6B7A77;
  --olive:#5B8C3E;      /* verde-oliva ativo */
  --olive-soft:#E8F2DC;
  --coral:#F08A5D;      /* coral quente - renda */
  --coral-soft:#FDE6D8;
  --plum:#4A3B6B;       /* roxo profundo - perda sutil */
  --sand:#F7F0E2;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Inter",-apple-system,sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:40px 28px 80px}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:48px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Fraunces",serif;font-weight:600;font-size:20px}
.logo-dot{width:12px;height:12px;background:var(--olive);border-radius:50%;position:relative}
.logo-dot::after{content:'';position:absolute;top:3px;left:3px;width:6px;height:6px;background:var(--coral);border-radius:50%}
.sair{color:var(--dim);text-decoration:none;font-size:14px;font-weight:500}
.sair:hover{color:var(--ink)}

/* Hero — ar generoso, tipografia que respira */
.hero{padding:16px 0 44px}
.hero .greet{font-family:"Fraunces",serif;font-style:italic;font-weight:400;font-size:22px;color:var(--dim);margin:0 0 20px;letter-spacing:-.01em}
.hero .money{font-family:"Fraunces",serif;font-weight:600;font-size:88px;letter-spacing:-.045em;line-height:1;margin:0;color:var(--ink)}
.hero .money .cents{color:var(--dim);font-weight:400}
.hero .sub{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sand);padding:7px 14px;border-radius:999px;font-size:14px;color:var(--ink)}
.chip.coral{background:var(--coral-soft);color:#9C3F17}
.chip b{font-weight:600}

/* CTA pill */
.cta-row{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.pill{background:var(--ink);color:var(--bg);border:none;padding:14px 24px;border-radius:999px;font-family:inherit;font-weight:500;font-size:15px;cursor:pointer;transition:transform .15s}
.pill:hover{transform:translateY(-1px)}
.pill.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}

/* Separador curvilíneo */
.sep{height:1px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.08),transparent);margin:48px 0 28px}

/* Section header */
.sect{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px}
.sect h2{font-family:"Fraunces",serif;font-weight:600;font-size:28px;letter-spacing:-.02em;margin:0}
.sect .link{color:var(--olive);text-decoration:none;font-weight:600;font-size:14px}

/* Card de ativo — cantos BEM arredondados, sem borda */
.card{background:var(--surface);border-radius:28px;padding:28px 28px;box-shadow:0 1px 2px rgba(26,43,42,.04)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px}
.card-head .left{display:flex;flex-direction:column;gap:4px}
.card-head .tag{display:inline-block;background:var(--olive-soft);color:var(--olive);padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.03em;width:fit-content;margin-bottom:10px}
.card-head .ticker{font-family:"Fraunces",serif;font-size:24px;font-weight:600;letter-spacing:-.01em}
.card-head .name{color:var(--dim);font-size:13.5px}
.card-head .right{text-align:right}
.card-head .price{font-family:"Fraunces",serif;font-size:28px;font-weight:600;letter-spacing:-.015em}
.card-head .price .cents{color:var(--dim);font-weight:400}
.card-head .delta{color:var(--plum);font-size:13.5px;margin-top:4px}

.card-stats{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px 0;border-top:1px solid rgba(0,0,0,.06);border-bottom:1px solid rgba(0,0,0,.06)}
.stat .lbl{font-size:12.5px;color:var(--dim);margin-bottom:4px}
.stat .val{font-family:"Fraunces",serif;font-size:20px;font-weight:600;letter-spacing:-.01em}
.stat.income .val{color:var(--coral)}

.card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.card-footer .detail{color:var(--ink);text-decoration:none;font-weight:600;font-size:14.5px;border-bottom:1.5px solid var(--ink);padding-bottom:1px}
.card-footer .quick{display:flex;gap:8px}
.card-footer .quick button{background:var(--sand);color:var(--ink);border:none;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer}
.card-footer .quick button:hover{background:#EDE4CF}

/* Pequeno rodapé */
.foot{color:var(--dim);font-size:12.5px;text-align:center;margin-top:60px}

@media (max-width:640px){
  .wrap{padding:28px 20px 60px}
  .hero .money{font-size:62px}
  .sect h2{font-size:22px}
  .card{padding:22px}
  .card-head{flex-direction:column;gap:16px}
  .card-head .right{text-align:left}
  .card-stats{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand"><span class="logo-dot"></span>rendi</div>
    <a href="#" class="sair">Sair</a>
  </div>

  <div class="hero">
    <p class="greet">Boa noite, Caio.</p>
    <h1 class="money">R$ 94<span class="cents">,50</span></h1>
    <div class="sub">
      <span class="chip">1 ativo</span>
      <span class="chip coral"><b>R$ 0,78</b> /mês projetado</span>
      <span class="chip">▼ R$ 10,50 na semana</span>
    </div>
    <div class="cta-row">
      <button class="pill">Simular aportes</button>
      <button class="pill ghost">Adicionar ativo</button>
    </div>
  </div>

  <div class="sep"></div>

  <div class="sect">
    <h2>Seus ativos</h2>
    <a href="#" class="link">Atualizar cotações</a>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="left">
        <span class="tag">FII · Papel</span>
        <div class="ticker">MXRF11</div>
        <div class="name">Maxi Renda</div>
      </div>
      <div class="right">
        <div class="price">R$ 94<span class="cents">,50</span></div>
        <div class="delta">▼ R$ 10,50 · −10,0%</div>
      </div>
    </div>
    <div class="card-stats">
      <div class="stat">
        <div class="lbl">Investido</div>
        <div class="val">R$ 105,00</div>
      </div>
      <div class="stat income">
        <div class="lbl">Rendimento mensal</div>
        <div class="val">R$ 0,78</div>
      </div>
    </div>
    <div class="card-footer">
      <a href="#" class="detail">Ver detalhes</a>
      <div class="quick">
        <button>Aportar</button>
        <button>Vender</button>
      </div>
    </div>
  </div>

  <p class="foot">Dados em tempo real · atualizados pelo pregão</p>

</div>
</body>
</html>
