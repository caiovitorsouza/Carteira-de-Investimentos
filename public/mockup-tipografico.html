<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mockup — Tipográfico puro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#FFFFFF;color:#000000;
  font-family:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"ss01","cv11"}
.wrap{max-width:620px;margin:0 auto;padding:88px 32px 120px}

.topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:120px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em}
.topbar nav{display:flex;gap:28px}
.topbar nav a{color:#000;text-decoration:none;font-size:14px;font-weight:400;opacity:.5;transition:opacity .15s}
.topbar nav a:hover{opacity:1}

/* Hero — hierarquia pura por tamanho */
.hero{margin-bottom:120px}
.hero .label{font-size:14px;font-weight:400;opacity:.5;margin-bottom:24px}
.hero .money{font-size:96px;font-weight:300;letter-spacing:-.05em;line-height:1;margin-bottom:28px}
.hero .money .cents{opacity:.3}
.hero .status{font-size:17px;font-weight:400}
.hero .status .down{font-weight:500}

/* Lista de posições */
.section{margin-bottom:80px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:40px}
.section-head h2{font-size:14px;font-weight:400;opacity:.5}
.section-head .count{font-size:14px;font-weight:400;opacity:.5}

.position{padding:28px 0;border-top:1px solid #000;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:baseline}
.position:last-child{border-bottom:1px solid #000}
.position .main .ticker{font-size:32px;font-weight:500;letter-spacing:-.025em;line-height:1;margin-bottom:6px}
.position .main .name{font-size:14px;font-weight:400;opacity:.5}
.position .main .meta{font-size:14px;font-weight:400;opacity:.5;margin-top:14px}
.position .right{text-align:right}
.position .right .val{font-size:32px;font-weight:500;letter-spacing:-.025em;line-height:1}
.position .right .val .cents{opacity:.3}
.position .right .delta{font-size:14px;font-weight:400;opacity:.5;margin-top:10px}

/* Botões — tipografia pura, só underline */
.actions{display:flex;gap:40px;margin-top:60px}
.action{background:none;border:none;padding:0;cursor:pointer;color:#000;
  font-family:inherit;font-size:17px;font-weight:500;letter-spacing:-.01em;
  border-bottom:1.5px solid #000;padding-bottom:2px;transition:opacity .15s}
.action:hover{opacity:.5}

.footer{margin-top:160px;font-size:13px;font-weight:400;opacity:.4;display:flex;justify-content:space-between}

@media (max-width:600px){
  .wrap{padding:56px 24px 80px}
  .topbar{margin-bottom:80px}
  .hero{margin-bottom:80px}
  .hero .money{font-size:64px}
  .position{grid-template-columns:1fr;gap:16px}
  .position .right{text-align:left}
  .position .right .val{font-size:24px}
  .position .main .ticker{font-size:24px}
  .actions{flex-direction:column;gap:20px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">Rendi</div>
    <nav>
      <a href="#">Carteira</a>
      <a href="#">Simular</a>
      <a href="#">Sair</a>
    </nav>
  </header>

  <section class="hero">
    <div class="label">Patrimônio</div>
    <div class="money">R$ 94<span class="cents">,50</span></div>
    <div class="status"><span class="down">Caiu R$ 10,50 na semana.</span> Projeta R$ 0,78 por mês em dividendos.</div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Posições</h2>
      <div class="count">1</div>
    </div>

    <div class="position">
      <div class="main">
        <div class="ticker">MXRF11</div>
        <div class="name">Maxi Renda · FII</div>
        <div class="meta">10 cotas · pago R$ 10,50 · hoje R$ 9,45</div>
      </div>
      <div class="right">
        <div class="val">R$ 94<span class="cents">,50</span></div>
        <div class="delta">−10,0% · −R$ 10,50</div>
      </div>
    </div>
  </section>

  <div class="actions">
    <button class="action">Adicionar ativo</button>
    <button class="action">Atualizar cotações</button>
  </div>

  <footer class="footer">
    <span>Rendi</span>
    <span>Dom. 11 out 2026</span>
  </footer>

</div>
</body>
</html>
